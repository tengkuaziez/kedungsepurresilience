# KEDUNGSEPUR RESILIENCE - pembaruan otomatis data prakiraan cuaca BMKG
# Menjalankan scripts/fetch_cuaca.py 2x sehari dan meng-commit GeoJSON jika berubah.
name: Perbarui cuaca BMKG

on:
  schedule:
    # 06:30 WIB = 23:30 UTC (hari sebelumnya); 18:30 WIB = 11:30 UTC
    # Catatan: jadwal GitHub Actions bisa tertunda beberapa menit saat antrean padat.
    - cron: "30 23 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Cegah dua job berjalan bersamaan (menghindari request ganda ke BMKG)
concurrency:
  group: cuaca-bmkg
  cancel-in-progress: false

jobs:
  tarik-cuaca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik data cuaca BMKG
        run: python scripts/fetch_cuaca.py --ulang

      - name: Commit GeoJSON jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/cuaca_kedungsepur.geojson)" ]; then
            echo "GeoJSON tidak berubah, tidak ada commit."
            exit 0
          fi
          git add data/cuaca_kedungsepur.geojson data/gagal.log
          git commit -m "Perbarui data cuaca BMKG $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
          git pull --rebase origin main
          git push origin HEAD:main
